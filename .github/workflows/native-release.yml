name: Native release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to build for a manual preview (for example v0.1.0)
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select and validate release ref
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          python3 scripts/release/metadata.py "$RELEASE_TAG" "$RUN_NUMBER" "$SOURCE_SHA" --output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Install Poppler for catalog validation
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - run: npm run catalog:check
      - run: npm run catalog:test
      - name: Test release tag validation
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'

  android:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ANDROID_VERSION_NAME: ${{ needs.validate.outputs.version_name }}
      ANDROID_VERSION_CODE: ${{ needs.validate.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: Confirm Android source commit
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Install Android SDK 36 tools
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Configure release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-signing.p12"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/release-signing.p12" >> "$GITHUB_ENV"
      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Verify signatures and stage Android assets
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$apk"
          test -s "$aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          java scripts/release/VerifySignedBundle.java "$aab"
          mkdir -p release-assets
          cp "$apk" release-assets/himnario-mackenna-android.apk
          cp "$aab" release-assets/himnario-mackenna-android.aab
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-signing.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: release-assets/himnario-mackenna-android.*
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: Confirm iOS source commit
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build iOS simulator app
        env:
          RELEASE_VERSION_NAME: ${{ needs.validate.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.validate.outputs.version_code }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            MARKETING_VERSION="$RELEASE_VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$RELEASE_VERSION_CODE"
      - name: Verify and package simulator app
        env:
          RELEASE_VERSION_NAME: ${{ needs.validate.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.validate.outputs.version_code }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/ios-derived/Build/Products/Release-iphonesimulator/App.app"
          python3 scripts/release/verify-ios-app.py "$app" "$RELEASE_VERSION_NAME" "$RELEASE_VERSION_CODE"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          lipo "$app/$executable" -verify_arch arm64
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "$app" release-assets/himnario-mackenna-ios-simulator.zip
          shasum -a 256 release-assets/himnario-mackenna-ios-simulator.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-release
          path: release-assets/himnario-mackenna-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'release'
    needs: [validate, android, ios-simulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: Confirm release source commit
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true
      - name: Check release target and prepare checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION_NAME: ${{ needs.validate.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.validate.outputs.version_code }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - "$RELEASE_TAG" "$REPOSITORY" "$SOURCE_SHA" <<'PY'
          import subprocess, sys
          tag, repository, source_sha = sys.argv[1:]
          ref = subprocess.check_output([
              "gh", "api", f"repos/{repository}/git/ref/tags/{tag}",
              "--jq", ".object.type + \" \" + .object.sha",
          ], text=True).strip()
          kind, sha = ref.split()
          if kind == "tag":
              sha = subprocess.check_output([
                  "gh", "api", f"repos/{repository}/git/tags/{sha}", "--jq", ".object.sha"
              ], text=True).strip()
          checked_out = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if sha != checked_out or sha != source_sha:
              raise SystemExit("Release tag does not resolve to the checked-out commit")
          PY
          test -s release-assets/himnario-mackenna-android.apk
          test -s release-assets/himnario-mackenna-android.aab
          test -s release-assets/himnario-mackenna-ios-simulator.zip
          (
            cd release-assets
            sha256sum himnario-mackenna-android.apk himnario-mackenna-android.aab himnario-mackenna-ios-simulator.zip > SHA256SUMS
            cat > BUILD-INFO.txt <<EOF
          Release tag: $RELEASE_TAG
          Source commit: $SOURCE_SHA
          Native marketing version: $RELEASE_VERSION_NAME
          Native build number: $RELEASE_VERSION_CODE
          Android APK and AAB are signed with this project's Android release key.
          iOS asset is an unsigned iOS Simulator .app archive; it is not an IPA and cannot be installed on iPhone.
          EOF
          )
      - name: Attach assets to the existing published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" release-assets/himnario-mackenna-android.apk release-assets/himnario-mackenna-android.aab release-assets/himnario-mackenna-ios-simulator.zip release-assets/SHA256SUMS release-assets/BUILD-INFO.txt --repo "$REPOSITORY" --clobber
