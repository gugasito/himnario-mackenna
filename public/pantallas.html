<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Himnario Mackenna · Propuesta de pantallas</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #32292a; background: #f5f1ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 30px; background: #f5f1ef; }
    header { max-width: 1230px; margin: 0 auto 24px; display: flex; align-items: end; justify-content: space-between; gap: 16px; }
    h1 { margin: 0 0 5px; font: 400 27px/1.1 Georgia, serif; }
    p { margin: 0; color: #817576; font-size: 12px; }
    .viewport-label { padding: 8px 12px; border: 1px solid #e6ded9; border-radius: 5px; color: #692e34; font-size: 11px; letter-spacing: .05em; white-space: nowrap; }
    main { max-width: 1230px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 360px)); justify-content: space-between; gap: 22px; }
    figure { margin: 0; }
    figcaption { margin: 0 0 8px 5px; color: #692e34; font: 600 13px Georgia, serif; }
    iframe { display: block; width: 360px; height: 740px; border: 1px solid #d8ceca; border-radius: 20px; background: #f5f1ef; box-shadow: 0 12px 36px rgba(67, 42, 39, .1); }
    @media (max-width: 1190px) { main { grid-template-columns: repeat(auto-fit, minmax(300px, 360px)); justify-content: center; } }
    @media (max-width: 600px) { body { padding: 20px 12px; } header { align-items: start; flex-direction: column; } iframe { width: min(360px, calc(100vw - 24px)); } }
  </style>
</head>
<body>
  <header>
    <div><h1>Himnario Mackenna · Propuesta de pantallas</h1><p>Vista previa de la app con sus rutas y estilos reales.</p></div>
    <span class="viewport-label">Vista previa de la app · 360 px</span>
  </header>
  <main>
    <figure><figcaption>Inicio</figcaption><iframe src="/" title="Vista previa móvil: Inicio"></iframe></figure>
    <figure><figcaption>Buscar</figcaption><iframe src="/himnos?q=18" title="Vista previa móvil: búsqueda de himnos"></iframe></figure>
    <figure><figcaption>Leer</figcaption><iframe src="/himno/18" title="Vista previa móvil: lectura del himno 18"></iframe></figure>
  </main>
</body>
</html>
